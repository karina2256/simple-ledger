appId: com.dailyledger.app
productName: 记账簿
copyright: 本地记账工具 · 数据全部保存在本机

directories:
  output: release
  buildResources: build

# 用本地已下载好的 Electron，避免再拉一次 100MB
electronDist: node_modules/electron/dist

# better-sqlite3 的 .node 已经按 Electron ABI 预编译好，禁止 electron-builder 重新编译
npmRebuild: false

files:
  - '**/*'
  - '!src/**'
  - '!docs/**'
  - '!scripts/**'
  - '!.tmp/**'
  - '!release/**'
  # 分发件与压缩包不能进包：'**/*' 会把它们一起打进 asar
  # （踩过：分享包/ + 分享包.zip 让安装包从 91MB 涨到 1.26GB）
  - '!分享包/**'
  - '!*.zip'
  - '!*.md'
  - '!electron.vite.config.ts'
  - '!tsconfig*.json'
  - '!tsconfig*.tsbuildinfo'
  - '!tailwind.config.js'
  - '!postcss.config.js'
  - '!.gitignore'
  # onnxruntime 自带全平台二进制，只留 Windows x64 的 CPU 版：
  # darwin / linux / arm64 / DirectML 这些加起来 200MB+，这台机器和分发对象都用不上
  - '!node_modules/onnxruntime-node/bin/napi-v6/darwin/**'
  - '!node_modules/onnxruntime-node/bin/napi-v6/linux/**'
  - '!node_modules/onnxruntime-node/bin/napi-v6/win32/arm64/**'
  - '!node_modules/onnxruntime-node/bin/napi-v6/win32/x64/DirectML.dll'
  - '!node_modules/onnxruntime-node/bin/napi-v6/win32/x64/dxcompiler.dll'
  - '!node_modules/onnxruntime-node/bin/napi-v6/win32/x64/dxil.dll'

extraResources:
  - from: resources/icons
    to: icons
  # 账单截图识别用的 PP-OCRv4 模型（约 15MB）：随包发，装完即可离线使用
  - from: resources/ocr
    to: ocr

# 原生模块必须解包到 asar 外，否则 require 不进来
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
  - '**/node_modules/onnxruntime-node/**'

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: msi
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 记账簿
  artifactName: daily-ledger-${version}-setup.${ext}

msi:
  artifactName: daily-ledger-${version}-installer.${ext}

portable:
  artifactName: daily-ledger-${version}-portable.${ext}
